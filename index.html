<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <main>
        <h1 class="title">Tic-Tac-Toe</h1></h1>
        <p class="subtitle">Who do you want to play against?</p>

        <section id="screen-player" class="screen">
            <div class="choose-enemy-btns">
                <button class="choose-enemy-btn">
                    <img src="./icons/couple-icon.svg" alt="couple-icon" class="btn-icon">
                    <h2>2 Players</h2>
                    <p>Same device</p>
                </button>
                <button class="choose-enemy-btn">
                    <img src="./icons/robot-icon.svg" alt="robot-icon" class="btn-icon">
                    <h2>Robot</h2>
                    <p>1 Player</p>
                </button>
            </div>

            <button class="start-game">Start game</button>
        </section>
    </main>

    <footer>
        <p>Developed By Andrey Marques @Copyright</p><a href="https://github.com/AndreyMarqz" target="_blank"><img src="./icons/github-icon.svg" alt="github-icon"></a>
    </footer>
    <script src="script.js"></script>
</body>
</html>
